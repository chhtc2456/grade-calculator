<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grade Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: linear-gradient(to right, #1e1e2f, #2c3e50);
      color: #f0f0f0;
    }

    h1 {
      text-align: center;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .input-group input {
      flex: 1;
      padding: 8px;
      background-color: #2c3e50;
      color: #000;
      border: 1px solid #444;
    }

    #category-list {
      margin-top: 20px;
      border-collapse: collapse;
      width: 100%;
      background-color: #0e0e17;
    }

    #category-list th, #category-list td {
      border: 1px solid #0f0808;
      padding: 10px;
      text-align: left;
      color: #846e6e;
    }

    #result {
      font-size: 1.3em;
      margin-top: 20px;
    }

    .progress-container {
      background-color: #eee;
      border-radius: 20px;
      overflow: hidden;
      height: 20px;
      margin-top: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #4CAF50;
      text-align: center;
      color: white;
      line-height: 20px;
      transition: width 0.5s ease;
    }

    tr.fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    tr.high-score {
      background-color: #b7f5c7;
      color: #000;
    }

    tr.low-score {
      background-color: #ffe6e6;
      color: #000;
    }

    button {
      padding: 10px 16px;
      margin-top: 10px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:nth-child(4) { background-color: #2196F3; color: white; }
    button:nth-child(5) { background-color: #100c0b; color: white; }
    button:nth-child(6) { background-color: #f44336; color: white; }
  </style>
</head>
<body>

  <h1>Grade Calculator</h1>

  <div class="input-group">
    <input type="text" id="name" placeholder="Category (e.g., Homework)">
    <input type="number" id="weight" placeholder="Weight (%)" min="0" max="100">
    <input type="number" id="score" placeholder="Your Score (%)" min="0" max="100">
    <button onclick="addCategory()">Add</button>
    <button onclick="clearInputFields()">Clear Input</button>
    <button onclick="clearAll()">Clear All</button>
  </div>

  <table id="category-list">
    <thead>
      <tr>
        <th>Category</th>
        <th>Weight (%)</th>
        <th>Score (%)</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>

  <div id="result"></div>
  <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>

  <div style="margin-top: 30px;">
    <h3>📈 What-If Simulator </h3>
    <div class="input-group">
      <input type="number" id="final-weight" placeholder="Final Exam Weight (%)" min="1" max="100">
      <input type="number" id="target-grade" placeholder="Target Overall Grade (%)" min="0" max="100">
      <button onclick="calculateNeededFinal()">Calculate</button>
      <button onclick="clearFinalInput()" style="background-color: #6c757d; color: rgb(16, 2, 2);">Clear Final Input</button>

    </div>
    <div id="final-result" style="margin-top: 10px; font-size: 1.2em;"></div>
  </div>

  <script>
    const categories = JSON.parse(localStorage.getItem('gradeCategories')) || [];

    function saveCategories() {
      localStorage.setItem('gradeCategories', JSON.stringify(categories));
    }

    function addCategory() {
      const name = document.getElementById("name").value;
      const weight = parseFloat(document.getElementById("weight").value);
      const score = parseFloat(document.getElementById("score").value);

      if (!name || isNaN(weight) || isNaN(score)) {
        alert("Please fill out all fields correctly.");
        return;
      }

      categories.push({ name, weight, score });
      saveCategories();
      updateTable();
      calculateGrade();

      document.getElementById("name").value = '';
      document.getElementById("weight").value = '';
      document.getElementById("score").value = '';
    }

    function updateTable() {
      const tbody = document.getElementById("table-body");
      tbody.innerHTML = '';

      categories.forEach(cat => {
        const row = document.createElement("tr");
        row.classList.add("fade-in");
        const score = Number(cat.score);
      if (score >= 85) row.classList.add("high-score");
      if (score <= 70) row.classList.add("low-score");
        row.innerHTML = `<td>${cat.name}</td><td>${cat.weight}</td><td>${cat.score}</td>`;
        tbody.appendChild(row);
      });
    }

    function calculateGrade() {
      let totalWeight = 0;
      let weightedScore = 0;

      categories.forEach(cat => {
        totalWeight += cat.weight;
        weightedScore += (cat.weight * cat.score);
      });

      const resultEl = document.getElementById("result");
      const bar = document.getElementById("progress-bar");

      if (totalWeight !== 100) {
        resultEl.innerText = `⚠️ Warning: Total weight is ${totalWeight}%. Make sure it adds up to 100%!`;
        bar.style.width = "0%";
        return;
      }

      const grade = (weightedScore / 100).toFixed(2);
      resultEl.innerText = `✅ Your current grade is: ${grade}%`;
      bar.style.width = `${grade}%`;
      bar.innerText = `${grade}%`;
    }

    function calculateNeededFinal() {
      const finalWeight = parseFloat(document.getElementById("final-weight").value);
      const targetGrade = parseFloat(document.getElementById("target-grade").value);

      if (isNaN(finalWeight) || isNaN(targetGrade)) {
        alert("Please enter valid values for both final weight and target grade.");
        return;
      }

      let currentWeight = 0;
      let weightedScore = 0;

      categories.forEach(cat => {
        currentWeight += cat.weight;
        weightedScore += (cat.weight * cat.score);
      });

      const finalResult = document.getElementById("final-result");

      if (currentWeight + finalWeight !== 100) {
        finalResult.innerText = `⚠️ Your categories + final must total 100%. Currently: ${currentWeight + finalWeight}%`;
        return;
      }

      const requiredFinal = ((targetGrade * 100) - weightedScore) / finalWeight;

      if (requiredFinal > 100) {
        finalResult.innerText = `❌ You need ${requiredFinal.toFixed(2)}% on the final — more than 100%. 😬`;
      } else if (requiredFinal < 0) {
        finalResult.innerText = `🎉 You're already guaranteed a ${targetGrade}% or higher!`;
      } else {
        finalResult.innerHTML = `📌 You need <strong>${requiredFinal.toFixed(2)}%</strong> on the final to get a ${targetGrade}% overall.`;
      }
    }

    function clearInputFields() {
      document.getElementById("name").value = '';
      document.getElementById("weight").value = '';
      document.getElementById("score").value = '';
      categories.pop(); // remove last added
      saveCategories();
      updateTable();
      calculateGrade();
    }

    function clearAll() {
      categories.length = 0;
      saveCategories();
      updateTable();
      document.getElementById("result").innerText = '';
      document.getElementById("final-result").innerText = '';
      document.getElementById("progress-bar").style.width = '0%';

      document.getElementById("name").value = '';
      document.getElementById("weight").value = '';
      document.getElementById("score").value = '';
      document.getElementById("final-weight").value = '';
      document.getElementById("target-grade").value = '';
    }
    function clearFinalInput() {
    document.getElementById("final-weight").value = '';
    document.getElementById("target-grade").value = '';
    document.getElementById("final-result").innerText = '';
  }


    updateTable();
    calculateGrade();
  </script>

</body>
</html>
